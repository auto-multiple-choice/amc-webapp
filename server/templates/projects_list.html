{% if projects %}
<div id="projects-action" class="bandeau">
  <div id="project-open" class="project-action ok selected" onclick="select_action(this);">Open</div>
  <div id="project-rename" class="project-action neutral" onclick="select_action(this);">Rename</div>
  <div id="project-clone" class="project-action neutral" onclick="select_action(this);">Clone</div>
  <div id="project-delete" class="project-action danger" onclick="select_action(this);">Delete</div>
</div>
<div class="espace overy">
  <ul id="projects-ul" class="projects-list selectable">
    {% for p in projects %}
    <li class="project-name selectable direct" onclick="select_project('{{p}}');">{{ p }}</li>
    {% endfor %}
  </ul>
</div>
{% endif %}
