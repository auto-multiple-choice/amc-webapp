<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AMC</title>
    <script src="/static/socket.io.js"></script>
    <script src="/static/amc.js"></script>
    <script src="/static/ace/ace.js"></script>
    <link rel="stylesheet" href="/static/amc.css">
</head>
<body>

  <div id="app">
    
    <div id="menu">
      <span id="connection-status" class="offline centered">⬤</span>
      <div id="menu-main" class="menubtn" onclick="tab_main();"
           title="Projects management"
           ><img src="/static/menu-amc.svg" class="menu"></div>
      <div id="menu-source" class="menubtn" onclick="tab_source();"
           title="Source and working documents"
           ><img src="/static/menu-source.svg" class="menu"></div>
      <div id="menu-scans" class="menubtn" onclick="tab_scans();"
           title="Data capture"
           ><img src="/static/menu-scans.svg" class="menu"></div>
      <div id="menu-grading" class="menubtn" onclick="tab_grading();"
           title="Grading and annotating"
           ><img src="/static/menu-grading.svg" class="menu"></div>
      <div id="project-name" onclick="tab_main();"></div>
    </div>

    <div id="tab">
    </div>

  </div>

  <div id="info-panel" class="hidden">
    <div id="info-content">
      <p id="info-text">
      </p>
      <p>
        <progress id="info-prop" value="0" max="100"></progress>
      </p>
    </div>
  </div>

  <div id="warn-panel" class="hidden">
    <div id="warn-content">
      <div class="bandeau">
        <span class="btn btn-neutral" onclick="warn_ok();">OK</span>
      </div>
    </div>
  </div>

</body>
</html>
