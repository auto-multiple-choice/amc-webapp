{% if err %}
<div id="warn-err" class="msg-err">
  <p class="message-title">{{ _('dialog.errors') }}</p>
  <p id="warn-err-text" class="message">
    {{ err | safe }}
  </p>
</div>
{% endif %}
{% if warn %}
<div id="warn-warn" class="msg-warn">
  <p class="message-title">{{ _('dialog.warnings') }}</p>
  <p id="warn-warn-text" class="message">
    {{ warn | safe }}
  </p>
</div>
{% endif %}
{% if info %}
<div id="warn-info" class="msg-info">
  <p id="warn-warn-text" class="message">
    {{ info | safe }}
  </p>
</div>
{% endif %}
<div class="bandeau adroite">
  <span class="btn btn-neutral" onclick="warn_ok();">{{ _('dialog.ok') }}</span>
</div>
