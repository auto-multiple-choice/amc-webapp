services:
  amc-web:
    build:
      context: .
      args:
        ## Add some LaTeX packages (space separated) you need here, as
        ## Alpine linux dependencies.
        ##
        ## AR: To enable Arabic templates, you should include
        ## texmf-dist-langarabic and font-noto-naskh-arabic
        ##
        ## JA: to enable Japanese templates, you should include
        ## texmf-dist-langjapanese
        ##
        - TEXLIVE_PKGS=
        
        ## Uncomment this line and choose a commit selector to select a
        ## particular AMC revision:
        #  - AMC_REVISION=HEAD
      dockerfile: Dockerfile
    image: amc-web
    ports:
      ## upon startup, the AMC web app will be available at http://localhost:8081
      - "8081:8080"
    volumes:
      - amc-files:/amc-web/files
    environment:
      # You can comment out this line to get less logs
      - AMC_SERVER_LOGGING=DEBUG
    restart: unless-stopped

volumes:
  amc-files: {}
