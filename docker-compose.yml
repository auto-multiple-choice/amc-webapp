services:
  amc-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: amc-web
    ports:
      - "8081:8080"
    volumes:
      - ./files:/amc-web/files
    environment:
      - AMC_TXT_DEFAULTFONT=Linux Libertine
      - HOME=/amc-web/files
      - AMC_REVISION=948508301cef320d89fa9ba25f3f62ba8c12c112
    env_file:
      - .env
    restart: unless-stopped
