services:
  amc-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: amc-web
    ports:
      ## upon startup, the AMC web app will be available at http://localhost:8081
      - "8081:8080"
    volumes:
      - amc-files:/amc-web/files
    environment:
      # Add some LaTeX packages you need here, as Alpine linux dependencies:
      - TEXLIVE_PKGS=
    ## Uncomment this line to select a particular AMC revision:
    #  - AMC_REVISION=948508301cef320d89fa9ba25f3f62ba8c12c112
    restart: unless-stopped

volumes:
  amc-files: {}
