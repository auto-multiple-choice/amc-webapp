services:
  amc-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: amc-web
    ports:
      ## upon startup, the AMC web app will be available at http://localhost:8081
      - "8081:8080"
    volumes:
      - amc-files:/amc-web/files
    environment:
      # Add some LaTeX packages you need here, as Alpine linux dependencies:
      - TEXLIVE_PKGS=
      # You can comment out this line to get less logs
      - AMC_SERVER_LOGGING=DEBUG
    ## Uncomment this line and choose a commit selector to select a
    ## particular AMC revision:
    #  - AMC_REVISION=HEAD
    restart: unless-stopped

volumes:
  amc-files: {}
