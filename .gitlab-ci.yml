stages:
  - build
  - test
  - deploy

build:
  stage: build
  image: docker:24.0.5-cli
  before_script:
    - docker info
  script:
    - apk add make git
    - make version
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - docker build -t amc-webapp .
    - docker image tag amc-webapp $CI_REGISTRY_IMAGE/test:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE/test:$CI_COMMIT_SHORT_SHA

tests-single:
  stage: test
  needs:
    - job: build
  image: python:3-alpine
  services:
    - name: $CI_REGISTRY_IMAGE/test:$CI_COMMIT_SHORT_SHA
      alias: amc
  variables:
    CI_DEBUG_SERVICES: "true"
    AMCWEB_BASEURL: "http://amc:8080"
    AMC_SERVER_LOGGING: DEBUG
    AMC_TESTS_HEADLESS: 1
    AMC_TESTS_NO_SANDBOX: 1
    AMC_TESTS_DIR: "$CI_PROJECT_DIR/tests-single"
    AMC_TESTS_SLEEP_FACTOR: 2
  script:
    - apk add chromium-chromedriver py3-pip ghostscript imagemagick
    - python3 -m venv /venv
    - cd tests
    - /venv/bin/pip3 install -r requirements.txt
    - mkdir -p $AMC_TESTS_DIR
    - /venv/bin/python3 simple.py
    - /venv/bin/python3 archive.py
    - /venv/bin/python3 txt.py
    - /venv/bin/python3 pdfform.py
    - /venv/bin/python3 multiple.py
    - /venv/bin/python3 i18n.py
  artifacts:
    when: always
    paths:
      - $AMC_TESTS_DIR/

tests-multi:
  stage: test
  needs:
    - job: build
  image: python:3-alpine
  services:
    - name: $CI_REGISTRY_IMAGE/test:$CI_COMMIT_SHORT_SHA
      alias: amc
  variables:
    CI_DEBUG_SERVICES: "true"
    AMCWEB_BASEURL: "http://amc:8080"
    AMC_SERVER_LOGGING: DEBUG
    AMC_TESTS_HEADLESS: 1
    AMC_TESTS_NO_SANDBOX: 1
    AMC_TESTS_DIR: "$CI_PROJECT_DIR/tests-multi"
    AMC_TESTS_SLEEP_FACTOR: 2
    AMC_USERHEADER: "X-AMC-User"
    AMC_ADMINS: chloe
  script:
    - apk add chromium-chromedriver py3-pip ghostscript imagemagick
    - python3 -m venv /venv
    - cd tests
    - /venv/bin/pip3 install -r requirements.txt
    - mkdir -p $AMC_TESTS_DIR
    - /venv/bin/python3 user.py
    - /venv/bin/python3 meeting.py
  artifacts:
    when: always
    paths:
      - $AMC_TESTS_DIR/

docker:
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  needs: ["tests-single", "tests-multi"]
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - docker image tag $CI_REGISTRY_IMAGE/test:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE/main:$CI_COMMIT_TAG
    - docker image tag $CI_REGISTRY_IMAGE/test:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE/main:latest
    - docker image push --all-tags $CI_REGISTRY_IMAGE/main


